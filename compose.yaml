name: sms-forwarding

services:
  dev:
    image: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    command:
      - sleep
      - infinity
    init: true
    network_mode: none
    working_dir: /workspace
    environment:
      CCACHE_DIR: /tmp/ccache
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    volumes:
      - type: bind
        source: .
        target: /workspace

  mock-server:
    build:
      context: ./mock_server
    environment:
      AUTH_REQUIRED: "false"
      OPENAPI_PATH: /spec/openapi.json
      PORT: "3000"
      WEB_ROOT: /web/build
    init: true
    ports:
      - target: 3000
        published: "4174"
        protocol: tcp
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./web/build
        target: /web/build
        read_only: true
      - type: bind
        source: ./dev_doc/openapi.json
        target: /spec/openapi.json
        read_only: true
