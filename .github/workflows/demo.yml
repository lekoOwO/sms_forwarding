name: Build Demo Site

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web UI dependencies
        run: npm ci --prefix web

      - name: Check Web UI
        run: npm --prefix web run check

      - name: Build demo site
        working-directory: web
        env:
          VITE_DEMO_MODE: '1'
        run: |
          npm exec -- vite build
          touch build/.nojekyll

      - name: Upload demo site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-site
          path: web/build
          if-no-files-found: error
          include-hidden-files: true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download demo site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: demo-site
          path: site

      - name: Publish demo site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -f site/index.html
          test -f site/.nojekyll
          test ! -e site/.git
          test ! -e site/src
          test ! -e site/node_modules
          test -z "$(find site -type l -print -quit)"
          git init --initial-branch=gh-pages published
          cp -a site/. published/
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish demo site from $GITHUB_SHA"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/gh-pages
