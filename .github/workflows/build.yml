name: Build Arduino Firmware

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build Web UI
      run: |
        npm ci --prefix web
        npm run check --prefix web
        npm run build --prefix web
        python3 -m unittest discover -s tests

    - name: Test API contract and production UI
      run: |
        docker compose up -d --build mock-server
        docker compose exec -T mock-server npm test
    
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
    
    - name: Install ESP32 platform
      run: |
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@3.3.10
    
    - name: Install dependencies
      run: |
        arduino-cli lib install "ReadyMail@0.4.2"
        arduino-cli lib install "ArduinoJson@7.4.3"
    
    - name: Compile firmware
      run: |
        scripts/apply-esp32-webserver-3.3.10-patch.sh "$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.10"
        arduino-cli compile --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs --output-dir build/firmware ./code

    - name: Stage release input
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: release-input
        path: |
          build/firmware/code.ino.bin
          scripts/sign-ota-release.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
    - name: Download verified build input
      uses: actions/download-artifact@v4
      with:
        name: release-input
        path: release-input

    - name: Build signed OTA package
      env:
        OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
      run: |
        umask 077
        trap 'rm -f "$RUNNER_TEMP/ota-signing-private.pem"' EXIT
        echo '95c411a29f8bc98c8c9d35220cdbfa5983d77ff66c9be4569a0de9d7bae28460  release-input/scripts/sign-ota-release.py' | sha256sum --check
        printf '%s' "$OTA_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/ota-signing-private.pem"
        python3 release-input/scripts/sign-ota-release.py release-input/build/firmware/code.ino.bin "sms-forwarder-${GITHUB_REF_NAME}.smsota" \
          --private-key "$RUNNER_TEMP/ota-signing-private.pem" \
          --version "$GITHUB_REF_NAME" \
          --counter "$GITHUB_RUN_NUMBER" \
          --expected-public-sha256 a3b8325cb8bbff1acaa402b7f1a39124b1297462da44f4c57b60929c996c4735

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" "sms-forwarder-${GITHUB_REF_NAME}.smsota" --generate-notes
