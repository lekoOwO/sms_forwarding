name: Build Arduino Firmware

permissions:
  contents: read

on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Verify firmware version source
      run: python3 scripts/generate-firmware-version.py --check

    - name: Verify Dev build increased
      if: github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        current_build=$(jq -r .devBuild firmware-version.json)
        if [[ -n "$GITHUB_BASE_REF" ]]; then previous_ref="origin/$GITHUB_BASE_REF"; else previous_ref="$BEFORE"; fi
        previous_build=0
        if previous_json=$(git show "${previous_ref}:firmware-version.json" 2>/dev/null); then
          previous_build=$(jq -r .devBuild <<<"$previous_json")
        fi
        test "$current_build" -gt "$previous_build"

    - name: Verify release tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        test "$GITHUB_REF_NAME" = "v$(jq -r .releaseVersion firmware-version.json)"
        git merge-base --is-ancestor "$GITHUB_SHA" origin/master

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build Web UI
      run: |
        npm ci --prefix web
        npm run check --prefix web
        npm run build --prefix web
        python3 -m unittest discover -s tests

    - name: Test API contract and production UI
      run: |
        docker compose up -d --build mock-server
        docker compose exec -T mock-server npm test
    
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
    
    - name: Install ESP32 platform
      run: |
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@3.3.10
    
    - name: Install dependencies
      run: |
        arduino-cli lib install "ReadyMail@0.4.2"
        arduino-cli lib install "ArduinoJson@7.4.3"
    
    - name: Compile firmware
      run: |
        scripts/apply-esp32-webserver-3.3.10-patch.sh "$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.10"
        release_build=0
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then release_build=1; fi
        arduino-cli compile --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs \
          --build-property "build.extra_flags=-DFIRMWARE_IS_RELEASE=${release_build}" \
          --output-dir build/firmware ./code

    - name: Stage release input
      if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: release-input
        path: |
          build/firmware/code.ino.bin
          build/firmware/code.ino.merged.bin
          firmware-version.json
          scripts/sign-ota-release.py

  prerelease:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download verified build input
      uses: actions/download-artifact@v4
      with:
        name: release-input
        path: release-input

    - name: Publish GitHub prerelease
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        FIRMWARE_DEV_BUILD=$(jq -r .devBuild release-input/firmware-version.json)
        DEV_TAG="dev-${FIRMWARE_DEV_BUILD}"
        ASSET_NAME="sms-forwarder-${DEV_TAG}.bin"
        mv release-input/build/firmware/code.ino.merged.bin "$ASSET_NAME"
        if gh release view "$DEV_TAG" >/dev/null 2>&1; then
          gh release upload "$DEV_TAG" "$ASSET_NAME" --clobber
        else
          gh release create "$DEV_TAG" "$ASSET_NAME" --target "$GITHUB_SHA" --prerelease \
            --title "Development build ${FIRMWARE_DEV_BUILD}" \
            --notes "Development firmware build ${FIRMWARE_DEV_BUILD}."
        fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
    - name: Download verified build input
      uses: actions/download-artifact@v4
      with:
        name: release-input
        path: release-input

    - name: Build signed OTA package
      id: sign
      env:
        OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
      run: |
        umask 077
        trap 'rm -f "$RUNNER_TEMP/ota-signing-private.pem"' EXIT
        echo '95c411a29f8bc98c8c9d35220cdbfa5983d77ff66c9be4569a0de9d7bae28460  release-input/scripts/sign-ota-release.py' | sha256sum --check
        printf '%s' "$OTA_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/ota-signing-private.pem"
        FIRMWARE_DEV_BUILD=$(jq -r .devBuild release-input/firmware-version.json)
        FIRMWARE_VERSION=$(jq -r .releaseVersion release-input/firmware-version.json)
        OTA_COUNTER=$((FIRMWARE_DEV_BUILD * 2 + 1))
        ASSET_NAME="sms-forwarder-${FIRMWARE_VERSION}.smsota"
        FULL_IMAGE_NAME="sms-forwarder-${FIRMWARE_VERSION}.bin"
        python3 release-input/scripts/sign-ota-release.py release-input/build/firmware/code.ino.bin "$ASSET_NAME" \
          --private-key "$RUNNER_TEMP/ota-signing-private.pem" \
          --version "$FIRMWARE_VERSION" \
          --counter "$OTA_COUNTER" \
          --expected-public-sha256 a3b8325cb8bbff1acaa402b7f1a39124b1297462da44f4c57b60929c996c4735
        mv release-input/build/firmware/code.ino.merged.bin "$FULL_IMAGE_NAME"
        echo "asset=$ASSET_NAME" >> "$GITHUB_OUTPUT"
        echo "full_image=$FULL_IMAGE_NAME" >> "$GITHUB_OUTPUT"

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        ASSET_NAME: ${{ steps.sign.outputs.asset }}
        FULL_IMAGE_NAME: ${{ steps.sign.outputs.full_image }}
      run: |
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" "$ASSET_NAME" "$FULL_IMAGE_NAME" --clobber
        else
          gh release create "$GITHUB_REF_NAME" "$ASSET_NAME" "$FULL_IMAGE_NAME" --generate-notes
        fi
