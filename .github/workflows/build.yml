name: Build Arduino Firmware

on:
  push:
    paths:
      - 'code/**'
      - 'web/**'
      - 'mock_server/**'
      - 'tests/**'
      - 'scripts/**'
      - 'compose.yaml'
      - 'dev_doc/openapi.json'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build Web UI
      run: |
        npm ci --prefix web
        npm run check --prefix web
        npm run build --prefix web
        python3 -m unittest discover -s tests

    - name: Test API contract and production UI
      run: |
        docker compose up -d --build mock-server
        docker compose exec -T mock-server npm test
    
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
    
    - name: Install ESP32 platform
      run: |
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@3.3.10
    
    - name: Install dependencies
      run: |
        arduino-cli lib install "ReadyMail@0.4.2"
    
    - name: Compile firmware
      run: |
        scripts/apply-esp32-webserver-3.3.10-patch.sh "$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.10"
        arduino-cli compile --fqbn esp32:esp32:esp32c3:PartitionScheme=no_ota ./code
